<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CropTechX | Smart AI Feed & Silage Quality Testing</title>

  <meta
    name="description"
    content="CropTechX Smart AI-Enabled Rapid Feed and Silage Quality Testing System for Dairy Farmers."
  />

  <style>
    :root{
      --navy:#14213d;
      --navy-2:#0c1730;
      --green:#16804d;
      --green-2:#23a765;
      --teal:#0e9f9a;
      --amber:#e4a11b;
      --cream:#f8f4e8;
      --bg:#f5f7fb;
      --card:#ffffff;
      --ink:#172033;
      --muted:#68738a;
      --line:#e5e9f2;
      --good:#14804a;
      --warn:#b77908;
      --bad:#c23b3b;
      --shadow:0 18px 45px rgba(20,33,61,.10);
      --radius:22px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:Inter,Segoe UI,Arial,sans-serif;
      background:var(--bg);
      color:var(--ink);
      line-height:1.65;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img{
      max-width:100%;
    }

    .container{
      width:min(1160px,92%);
      margin:auto;
    }

    /* =========================
       HEADER
    ========================= */

    header{
      position:sticky;
      top:0;
      z-index:1000;
      background:rgba(20,33,61,.97);
      backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .nav{
      min-height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:25px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      color:#fff;
      font-weight:900;
      font-size:21px;
      letter-spacing:.2px;
    }

    .brand-mark{
      width:42px;
      height:42px;
      border-radius:13px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#24a864,#0e9f9a);
      box-shadow:0 8px 22px rgba(35,167,101,.28);
      font-size:21px;
    }

    .brand span{
      color:#53d68d;
    }

    nav{
      display:flex;
      align-items:center;
      gap:22px;
      flex-wrap:wrap;
    }

    nav a{
      color:#dce5f5;
      font-size:14px;
      font-weight:700;
      transition:.2s;
    }

    nav a:hover{
      color:#62df98;
    }

    .nav-btn{
      background:#39c878;
      color:#092318;
      padding:11px 16px;
      border-radius:11px;
      font-weight:900;
    }

    /* =========================
       HERO
    ========================= */

    .hero{
      min-height:720px;
      display:flex;
      align-items:center;
      position:relative;
      overflow:hidden;
      color:#fff;
      background:
        linear-gradient(90deg,rgba(8,18,39,.97),rgba(15,31,55,.91)),
        url("https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=1800&q=85");
      background-size:cover;
      background-position:center;
    }

    .hero::after{
      content:"";
      position:absolute;
      width:500px;
      height:500px;
      right:-180px;
      top:-150px;
      border-radius:50%;
      background:rgba(47,203,119,.13);
      filter:blur(20px);
    }

    .hero-grid{
      display:grid;
      grid-template-columns:1.08fr .92fr;
      gap:60px;
      align-items:center;
      position:relative;
      z-index:2;
    }

    .eyebrow{
      display:inline-block;
      font-size:12px;
      letter-spacing:1.6px;
      font-weight:900;
      color:#64dc96;
      margin-bottom:18px;
    }

    .hero h1{
      font-size:clamp(42px,5.4vw,72px);
      line-height:1.04;
      letter-spacing:-2.5px;
      max-width:720px;
    }

    .hero h1 span{
      color:#55d88d;
    }

    .hero p{
      color:#c7d2e6;
      max-width:680px;
      margin:24px 0 30px;
      font-size:17px;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:13px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:13px 18px;
      border-radius:12px;
      font-weight:900;
      border:1px solid transparent;
      cursor:pointer;
      transition:.2s;
      font-size:14px;
    }

    .btn.primary{
      background:#35c878;
      color:#082317;
    }

    .btn.primary:hover{
      transform:translateY(-2px);
      background:#49d888;
    }

    .btn.secondary{
      background:rgba(255,255,255,.07);
      color:#fff;
      border-color:rgba(255,255,255,.18);
    }

    .btn.secondary:hover{
      background:rgba(255,255,255,.12);
    }

    .hero-card{
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.16);
      border-radius:30px;
      padding:24px;
      box-shadow:0 25px 70px rgba(0,0,0,.25);
      backdrop-filter:blur(10px);
    }

    .phone{
      width:255px;
      margin:auto;
      padding:13px;
      border-radius:35px;
      background:#070d19;
      border:5px solid #25324a;
      box-shadow:0 30px 55px rgba(0,0,0,.35);
    }

    .phone-screen{
      min-height:460px;
      border-radius:25px;
      padding:20px;
      background:linear-gradient(180deg,#f7fff9,#eaf7ef);
      color:var(--ink);
    }

    .phone-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:11px;
      font-weight:900;
      color:#527064;
    }

    .phone-title{
      margin-top:35px;
      font-size:13px;
      font-weight:900;
      color:var(--green);
      letter-spacing:1px;
    }

    .phone-grade{
      font-size:65px;
      line-height:1;
      font-weight:950;
      color:var(--green);
      margin:10px 0;
    }

    .phone-confidence{
      color:#526274;
      font-size:13px;
      margin-bottom:25px;
    }

    .phone-stat{
      display:flex;
      justify-content:space-between;
      border-top:1px solid #dce9df;
      padding:10px 0;
      font-size:12px;
    }

    .phone-bottom{
      margin-top:25px;
      background:#fff;
      padding:12px;
      border-radius:14px;
      text-align:center;
      font-size:11px;
      color:#536375;
    }

    .hero-meta{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:1px;
      margin-top:55px;
      background:rgba(255,255,255,.13);
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      overflow:hidden;
    }

    .meta{
      padding:16px;
      background:rgba(10,22,43,.55);
    }

    .meta small{
      display:block;
      color:#8fa0bb;
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:1px;
      margin-bottom:4px;
    }

    .meta strong{
      font-size:13px;
    }

    /* =========================
       COMMON SECTIONS
    ========================= */

    section{
      padding:95px 0;
    }

    .section-number{
      font-size:12px;
      color:var(--green);
      letter-spacing:2px;
      font-weight:950;
      margin-bottom:12px;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      gap:30px;
      align-items:end;
      margin-bottom:38px;
    }

    .section-head h2{
      font-size:clamp(30px,4vw,48px);
      line-height:1.08;
      letter-spacing:-1.4px;
    }

    .section-head p{
      max-width:560px;
      color:var(--muted);
    }

    .dark-section{
      background:var(--navy);
      color:#fff;
    }

    .dark-section .section-head p{
      color:#b9c5d8;
    }

    /* =========================
       PROBLEM
    ========================= */

    .problem-statement{
      background:var(--cream);
      border:1px solid #eadfbe;
      border-radius:25px;
      padding:30px;
      margin-bottom:28px;
      box-shadow:var(--shadow);
    }

    .problem-statement small{
      color:#a46c00;
      font-weight:900;
      letter-spacing:1.4px;
    }

    .problem-statement h3{
      margin-top:10px;
      font-size:23px;
      max-width:920px;
    }

    .problem-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:20px;
      padding:24px;
      box-shadow:var(--shadow);
    }

    .card-icon{
      width:44px;
      height:44px;
      border-radius:13px;
      display:grid;
      place-items:center;
      background:#e8f7ee;
      color:var(--green);
      font-size:21px;
      margin-bottom:17px;
    }

    .card h3{
      font-size:18px;
      margin-bottom:8px;
    }

    .card p{
      color:var(--muted);
      font-size:14px;
    }

    /* =========================
       SOLUTION
    ========================= */

    .solution-grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:15px;
    }

    .solution-card{
      padding:25px 20px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.055);
      border-radius:19px;
    }

    .solution-card .num{
      color:#5ce195;
      font-size:12px;
      font-weight:900;
      letter-spacing:1px;
    }

    .solution-card h3{
      margin:12px 0 8px;
      font-size:18px;
    }

    .solution-card p{
      color:#b8c5d9;
      font-size:13px;
    }

    /* =========================
       AI DEMO
    ========================= */

    #demo{
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(rgba(12,23,48,.92),rgba(12,23,48,.95)),
        url("https://images.unsplash.com/photo-1527153857715-3908f2bae5e8?auto=format&fit=crop&w=1800&q=85");
      background-size:cover;
      background-position:center;
      color:#fff;
    }

    .demo{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.16);
      border-radius:28px;
      padding:28px;
      box-shadow:0 30px 70px rgba(0,0,0,.25);
      backdrop-filter:blur(12px);
    }

    .demo-top{
      display:grid;
      grid-template-columns:1fr 1.15fr;
      gap:28px;
    }

    .drop{
      border:2px dashed rgba(255,255,255,.4);
      border-radius:20px;
      padding:34px;
      text-align:center;
      background:rgba(255,255,255,.94);
      color:var(--ink);
    }

    .drop h3{
      margin-bottom:5px;
    }

    .drop p{
      color:var(--muted);
      font-size:13px;
    }

    .upload-label{
      display:inline-block;
      background:var(--navy);
      color:#fff;
      padding:12px 17px;
      border-radius:11px;
      font-weight:900;
      cursor:pointer;
      margin-top:15px;
    }

    .upload-label:hover{
      background:#23375f;
    }

    #file{
      display:none;
    }

    .preview{
      margin:18px auto 10px;
      max-width:100%;
      max-height:260px;
      border-radius:16px;
      display:none;
      object-fit:cover;
      box-shadow:0 10px 25px rgba(0,0,0,.15);
    }

    .file-name{
      color:#66738a;
      font-size:12px;
      min-height:20px;
    }

    .detect-box{
      margin:18px 0;
      padding:15px;
      background:#edf9f1;
      border:1px solid #ccebd7;
      border-radius:14px;
      text-align:left;
    }

    .detect-box small{
      display:block;
      color:#5d7567;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:1px;
      font-weight:900;
    }

    .detected-type{
      color:var(--green);
      font-size:24px;
      font-weight:950;
      margin-top:3px;
    }

    .detect-confidence{
      color:#607266;
      font-size:12px;
    }

    .analyze-btn{
      width:100%;
      margin-top:10px;
    }

    .report-area h3{
      margin-bottom:14px;
    }

    .results{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:11px;
    }

    .result{
      padding:15px;
      border-radius:14px;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(255,255,255,.3);
      color:var(--ink);
    }

    .result small{
      color:var(--muted);
      display:block;
      font-size:11px;
      margin-bottom:3px;
    }

    .result strong{
      font-size:18px;
    }

    .grade{
      font-size:29px;
      font-weight:950;
      color:var(--good);
    }

    .report{
      margin-top:15px;
      padding:18px;
      background:rgba(255,255,255,.96);
      border-radius:15px;
      color:var(--ink);
      font-size:14px;
      border-left:4px solid var(--green);
    }

    .demo-note{
      margin-top:15px;
      color:#aebbd0;
      font-size:12px;
    }

    /* =========================
       WORKFLOW
    ========================= */

    .workflow{
      display:grid;
      gap:13px;
    }

    .workflow-row{
      display:grid;
      grid-template-columns:80px 220px 1fr;
      align-items:center;
      gap:20px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:17px;
      padding:18px 20px;
      box-shadow:0 8px 25px rgba(20,33,61,.05);
    }

    .workflow-num{
      width:48px;
      height:48px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:#e9f8ef;
      color:var(--green);
      font-weight:950;
    }

    .workflow-row h3{
      font-size:17px;
    }

    .workflow-row p{
      color:var(--muted);
      font-size:14px;
    }

    /* =========================
       FEATURES
    ========================= */

    .features-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:17px;
    }

    .feature{
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      padding:25px;
      box-shadow:var(--shadow);
    }

    .feature h3{
      margin:10px 0 8px;
    }

    .feature p{
      color:var(--muted);
      font-size:14px;
    }

    /* =========================
       EXPECTED OUTPUT
    ========================= */

    .output-grid{
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:25px;
    }

    .output-panel{
      background:#fff;
      border:1px solid var(--line);
      border-radius:23px;
      padding:27px;
      box-shadow:var(--shadow);
    }

    .output-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:22px;
    }

    .output-header strong{
      color:var(--green);
    }

    .metric-list{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }

    .metric{
      padding:16px;
      background:#f7f9fc;
      border-radius:14px;
      border:1px solid var(--line);
    }

    .metric small{
      display:block;
      color:var(--muted);
      font-size:11px;
    }

    .metric strong{
      font-size:20px;
    }

    .output-side{
      display:grid;
      gap:15px;
    }

    /* =========================
       TECHNOLOGY
    ========================= */

    .tech-section{
      background:#edf3f0;
    }

    .pill-grid{
      display:flex;
      flex-wrap:wrap;
      gap:11px;
    }

    .pill{
      background:#fff;
      border:1px solid #dbe4df;
      border-radius:999px;
      padding:11px 16px;
      font-weight:800;
      font-size:13px;
      box-shadow:0 5px 15px rgba(20,33,61,.04);
    }

    /* =========================
       INNOVATION
    ========================= */

    .innovation-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:17px;
    }

    .innovation-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      padding:25px;
      box-shadow:var(--shadow);
    }

    .innovation-card h3{
      margin-bottom:8px;
    }

    .innovation-card p{
      color:var(--muted);
      font-size:14px;
    }

    /* =========================
       ROADMAP
    ========================= */

    .roadmap{
      display:grid;
      gap:12px;
    }

    .roadmap-row{
      display:grid;
      grid-template-columns:70px 220px 1fr;
      gap:20px;
      align-items:center;
      background:#fff;
      border:1px solid var(--line);
      border-radius:17px;
      padding:18px;
    }

    .roadmap-num{
      font-size:25px;
      font-weight:950;
      color:var(--green);
    }

    .roadmap-row h3{
      font-size:16px;
    }

    .roadmap-row p{
      color:var(--muted);
      font-size:13px;
    }

    /* =========================
       TEAM
    ========================= */

    .team-section{
      background:var(--navy);
      color:#fff;
    }

    .team-section .section-head p{
      color:#b8c5d9;
    }

    .team-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:17px;
    }

    .team-card{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:20px;
      padding:25px;
    }

    .avatar{
      width:55px;
      height:55px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#27b66b,#0e9f9a);
      color:#fff;
      font-weight:950;
      margin-bottom:15px;
    }

    .team-card h3{
      font-size:17px;
    }

    .team-card p{
      color:#aebbd0;
      font-size:13px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer{
      background:#091329;
      color:#aab7cc;
      padding:35px 0;
    }

    .footer-inner{
      display:flex;
      justify-content:space-between;
      gap:25px;
      align-items
